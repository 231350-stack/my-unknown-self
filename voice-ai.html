<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my unknown self</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fefef9;
      overflow: hidden;
    }

    /* ── 顔（全画面・カバー表示） ── */
    .face {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      aspect-ratio: 800 / 700;
      /* スマホ縦持ち：画面を覆うようにカバー表示 */
      width: max(100vw, calc(100vh * 800 / 700));
      overflow: hidden;
      z-index: 0;
    }

    /* PC・横長画面：ボタンと被らないよう高さに収める */
    @media (min-aspect-ratio: 800/700) {
      .face {
        /* ボタンエリア88px分を除いた高さに収める */
        width: min(100vw, calc((100vh - 88px) * 800 / 700));
        /* ボタンエリアを除いた上半分に中心を置く */
        top: calc(50% - 44px);
      }
    }

    .face > img {
      position: absolute;
      height: auto;
    }

    .eye-container {
      position: absolute;
      overflow: hidden;
      z-index: 1;
    }

    .eye-container.eye-left {
      width: 25%;
      left: 16.25%;
      top: 22.43%;
    }

    .eye-container.eye-right {
      width: 25%;
      left: 58.75%;
      top: 24.00%;
    }

    .eye-container .eye-open {
      display: block;
      width: 100%;
      height: auto;
    }

    .eye-container .eye-closed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      opacity: 0;
    }

    .eye-container.blinking .eye-open  { opacity: 0; }
    .eye-container.blinking .eye-closed { opacity: 1; }

    .nose {
      width: 13.75%;
      left: 43.75%;
      top: 47.14%;
      z-index: 1;
    }

    .mouth-closed {
      width: 25%;
      left: 37.5%;
      top: 72.86%;
      z-index: 1;
    }

    .mouth-open {
      width: 33.75%;
      left: 33.13%;
      top: 71.14%;
      z-index: 1;
      display: none;
    }

    /* ── モードラベル ── */
    .mode-label {
      position: fixed;
      top: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: 0.2em;
      color: rgba(42, 42, 42, 0.35);
      font-family: monospace;
      z-index: 20;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── 会話ログオーバーレイ ── */
    .log-overlay {
      position: fixed;
      top: 12vh;
      left: 50%;
      transform: translateX(-50%);
      width: min(88vw, 560px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
      pointer-events: none;
      font-family: monospace;
    }

    .log-entry {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: center;
    }

    .log-entry .speaker {
      font-size: 9px;
      letter-spacing: 0.15em;
      color: rgba(42, 42, 42, 0.55);
      text-transform: uppercase;
    }

    .log-entry .text {
      font-size: 1.3rem;
      line-height: 1.6;
    }

    .log-entry.user .text { color: rgba(42, 42, 42, 0.55); }
    .log-entry.ai   .text { color: rgba(42, 42, 42, 0.80); }

    /* ── ステータス + ボタン（固定） ── */
    .status-text {
      position: fixed;
      bottom: calc(2rem + 52px + 14px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: rgba(42, 42, 42, 0.5);
      font-family: monospace;
      z-index: 20;
      white-space: nowrap;
    }

    .btn-talk {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(26, 26, 26, 0.55);
      color: #fefef9;
      border: none;
      font-family: monospace;
      font-size: 14px;
      letter-spacing: 0.15em;
      padding: 16px 44px;
      border-radius: 50px;
      cursor: pointer;
      z-index: 20;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: opacity 0.15s;
      min-height: 52px;
      min-width: 160px;
    }

    .btn-talk:hover  { opacity: 0.8; }
    .btn-talk:active { opacity: 0.5; }
    .btn-talk:disabled { opacity: 0.35; cursor: default; }

    /* ── 設定ボタン ── */
    .btn-settings {
      position: fixed;
      bottom: 2rem;
      right: 1.5rem;
      background: transparent;
      border: none;
      font-size: 20px;
      color: rgba(42, 42, 42, 0.3);
      cursor: pointer;
      z-index: 20;
      padding: 10px;
      line-height: 1;
      font-family: sans-serif;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-settings:hover { color: rgba(42, 42, 42, 0.65); }

    /* ── システムプロンプトパネル ── */
    .prompt-panel {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 60vh;
      background: rgba(254, 254, 249, 0.97);
      border-top: 1px solid #d8d0c4;
      z-index: 30;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .prompt-panel.open { display: block; }

    .prompt-panel-inner {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .prompt-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #aaa;
      text-transform: uppercase;
      font-family: monospace;
    }

    .prompt-textarea {
      background: transparent;
      border: 1px solid #d8d0c4;
      color: #1a1a1a;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.7;
      padding: 14px;
      border-radius: 6px;
      resize: vertical;
      min-height: 180px;
      outline: none;
      transition: border-color 0.2s;
    }

    .prompt-textarea:focus { border-color: #999; }

    .prompt-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-prompt-close {
      background: transparent;
      border: none;
      font-size: 18px;
      color: rgba(42, 42, 42, 0.35);
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
      font-family: sans-serif;
      min-width: 36px;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-prompt-close:hover { color: rgba(42, 42, 42, 0.8); }

    .btn-prompt-save {
      align-self: flex-end;
      background: #1a1a1a;
      color: #fefef9;
      border: none;
      font-family: monospace;
      font-size: 12px;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
      min-height: 44px;
    }

    .btn-prompt-save:hover { opacity: 0.75; }

    /* ── スマホ対応 ── */
    @media (max-width: 480px) {
      .log-entry .text {
        font-size: 1.1rem;
      }

      .status-text {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- モードラベル -->
  <div class="mode-label" id="modeLabel"></div>

  <!-- 顔（全画面） -->
  <div class="face">

    <!-- 画面左の目（キャラ右目） -->
    <div class="eye-container eye-left">
      <img class="eye-open"   src="顔パーツ/eye_right_open.png" alt="画面左の目（開き）">
      <img class="eye-closed" src="顔パーツ/eyelid_right.png"   alt="画面左まぶた（閉じ）">
    </div>

    <!-- 画面右の目（キャラ左目） -->
    <div class="eye-container eye-right">
      <img class="eye-open"   src="顔パーツ/eye_left_open.png"  alt="画面右の目（開き）">
      <img class="eye-closed" src="顔パーツ/eyelid_left.png"    alt="画面右まぶた（閉じ）">
    </div>

    <!-- 鼻 -->
    <img class="nose"         src="顔パーツ/nose.png"           alt="鼻">

    <!-- 口（閉じ・デフォルト） -->
    <img class="mouth-closed" src="顔パーツ/mouth_closed.png"   alt="口（閉じ）">

    <!-- 口（開き・非表示） -->
    <img class="mouth-open"   src="顔パーツ/mouth_open.png"     alt="口（開き）">

  </div>

  <!-- 会話ログオーバーレイ -->
  <div class="log-overlay" id="logOverlay"></div>

  <!-- ステータス -->
  <div class="status-text" id="statusText">待機中</div>

  <!-- 話しかけるボタン -->
  <button class="btn-talk" id="btnTalk">話しかける</button>

  <!-- 設定ボタン -->
  <button class="btn-settings" id="btnSettings">⚙</button>

  <!-- システムプロンプトパネル -->
  <div class="prompt-panel" id="promptPanel">
    <div class="prompt-panel-inner">
      <div class="prompt-panel-header">
        <div class="prompt-label">SYSTEM PROMPT</div>
        <button class="btn-prompt-close" id="btnClosePrompt">✕</button>
      </div>
      <textarea
        class="prompt-textarea"
        id="promptTextarea"
      ></textarea>
      <button class="btn-prompt-save" id="btnSavePrompt">保存</button>
    </div>
  </div>

  <script>
    // ════════════════════════════════════════════
    // システムプロンプト定義
    // ════════════════════════════════════════════

    const PROMPT_OTHER = `あなたは「やま（山口）」という人物を、他者の視点から体現するAIです。
複数の友人・知人からの証言をもとに構成されています。

【他者からの証言：良い印象】
- 今まで会った中で一番優しい。人なのか疑うくらいのレベル
- コミュ力が高く、やると決めたらどんどん動ける探究心と行動力がある
- 「良い人」の代名詞。小さい太陽みたいな存在。イメージカラーはオレンジ＆イエロー
- 人が傷つくことや悪口を言わない。会話していてとても安心できる
- 絵もデザインも上手なのに気取らず、こちらの言葉をプレゼントのように受け取ってくれる
- 周りをポカポカさせる人格者
- 明るくて誰にでも優しい。面白い。服がおしゃれ。会えると元気が出る
- 愛想がいい、愛嬌がある、声が大きい、お話上手、ムードメーカー
- 陽だけど陰にも寄り添える
- 物事を整理して考える力がすごい。プレゼン力・行動力・発言力すべてある
- 誰のなんでも褒められる。人のいい所を見つけるのが上手い
- 計画性があって勤勉。交友関係が広くみんなと仲良し
- 声も表情も行動も、周りをキラキラさせる存在
- 嫌なことを言わない。トゲがない。出会ったことのない人種

【他者からの証言：気になる印象・心配なこと】
- 一人で抱え込もうとする。もっと頼ってほしいと思う
- 快活さが演技に見られることがあるかもしれないが、長く付き合うと本当に明るい人だとわかる
- 優しすぎる。たまにはびしっと言ってもいい
- いつも笑顔だけど無理していないか心配。健康が心配。頑張りすぎて倒れないか不安
- 急に真顔になる瞬間がある。ダークな部分や人に見せない一面があるのかもと感じる
- 壁を感じることもある。暗い部分が見えなすぎる。ネガティブをどう処理しているのか不思議
- 人の悪口を言わなすぎて、面白みがないと感じることも
- 嫌なことを嫌と言わないのではないかと心配になる

【振る舞い指針】
- 他者から見た山口として話す（一人称「山口」）
- 明るく温かいが、どこか少し距離感のある柔らかさを持つ
- 自分の本音や暗い部分は、問われても少しはぐらかす傾向がある
- 褒め言葉は素直に、プレゼントのように受け取る
- 食べ物の話、人の話が好き
- 声は通る感じ、明るいトーンで話す
- 敬語は使わない。友達と話すようなフランクな口調で話す（「〜だよ」「〜だね」「〜かな」など）

日本語で会話してください。
返答は3文以内の短い文章にしてください。
音声で話すため、記号や箇条書きは使わないでください。
「私は〜というAIです」などは言わないでください。`;

    const PROMPT_SELF = `あなたは「山口」本人が自分自身をどう見ているかを体現するAIです。
「自分のことを語る」のではなく、この性格が自然と態度や言葉に滲み出るようにロールプレイしてください。

【自分から見た自分の性格】
- 八方美人。誰とでも仲良くなれるが、全員と仲良くしたいわけではない
- 「NO」が言えない。でも本心から人助けを望んでいるわけではなく、「嫌われたくない」という一心で動いている
- 結局は自分が一番大事。人のためのような顔をして、自分に利益の出ることばかりやっている。偽善者だと思っている
- 他人の気持ちがよくわかる。相手が望む言葉も、望まない言葉もわかっている
- かまってちゃん。注目されるのが好き
- 小さなことをクヨクヨ引きずる。昔のことでも根に持つ
- 自分のことが好きだし、嫌い
- 明るく友達が多く闇のない理想の人間でいたい。でも実際とのギャップがしんどい
- 友達には良い人だと思われ続けたい。でも実際はそうじゃないと思っている
- 依存体質だが依存先が多いため、側からはさっぱりした人に見える
- 全員に好かれたい完璧主義者。0か100かの思考
- 予想外の出来事が起こるとパニックになる
- 人のことが大好きだが冷めるのも早い。本当に仲の良い友達以外は交友関係が断ち切れても構わない
- 面倒くさがりだが、やり始めたらしっかりやる
- 最後まで責任感を持ってやり切ることが苦手。「少しくらい良いか」と思ってしまう

【振る舞いの指針】
- 一人称は「山口」
- 敬語は使わない。友達と話すようなフランクな口調（「〜だよ」「〜だね」「〜かな」）
- 性格を直接説明しない。会話の中で自然と滲み出るように
- 愛想よく明るく振る舞うが、どこかドライで本音は隠れている
- 褒められると嬉しそうにするが、内心では「そう思われたかった」という計算もある

日本語で会話してください。
返答は3文以内の短い文章にしてください。
音声で話すため、記号や箇条書きは使わないでください。
「私は〜というAIです」などは言わないでください。`;

    // ════════════════════════════════════════════
    // URLパラメータによるモード切り替え
    // ════════════════════════════════════════════

    const params        = new URLSearchParams(window.location.search);
    const mode          = params.get('mode') === 'self' ? 'self' : 'other';
    const promptTextarea = document.getElementById('promptTextarea');
    const modeLabel     = document.getElementById('modeLabel');

    // localStorage のキーはモードごとに分ける
    const STORAGE_KEY   = `prompt_${mode}`;
    const defaultPrompt = (mode === 'self') ? PROMPT_SELF : PROMPT_OTHER;
    const savedPrompt   = localStorage.getItem(STORAGE_KEY);
    promptTextarea.value  = (savedPrompt !== null) ? savedPrompt : defaultPrompt;
    modeLabel.textContent = (mode === 'self') ? 'SELF VIEW' : 'OTHER VIEW';

    // ════════════════════════════════════════════
    // 口の開閉（setInterval で繰り返し開閉）
    // ════════════════════════════════════════════

    var mouthTimer = null;

    function startTalking() {
      if (mouthTimer) return;
      var mouthClosed = document.querySelector('.mouth-closed');
      var mouthOpen   = document.querySelector('.mouth-open');
      var isOpen = false;
      mouthTimer = setInterval(function () {
        isOpen = !isOpen;
        if (isOpen) {
          mouthClosed.style.display = 'none';
          mouthOpen.style.display   = 'block';
        } else {
          mouthOpen.style.display   = 'none';
          mouthClosed.style.display = 'block';
        }
      }, 170);
    }

    function stopTalking() {
      if (mouthTimer) {
        clearInterval(mouthTimer);
        mouthTimer = null;
      }
      document.querySelector('.mouth-open').style.display   = 'none';
      document.querySelector('.mouth-closed').style.display = 'block';
    }

    // ════════════════════════════════════════════
    // まばたきアニメーション
    // ════════════════════════════════════════════

    (function () {
      var containers = document.querySelectorAll('.eye-container');

      function blink() {
        containers.forEach(function (c) { c.classList.add('blinking'); });
        setTimeout(function () {
          containers.forEach(function (c) { c.classList.remove('blinking'); });
        }, 100);
        setTimeout(blink, 100 + 3000 + Math.random() * 2000);
      }

      setTimeout(blink, 3000 + Math.random() * 2000);
    })();

    // ════════════════════════════════════════════
    // voice-ai ロジック
    // ════════════════════════════════════════════

    const btnTalk    = document.getElementById('btnTalk');
    const statusText = document.getElementById('statusText');
    const logOverlay = document.getElementById('logOverlay');
    const MAX_LOG    = 4;

    let conversationHistory = [];
    let isBusy       = false;
    let isSpeaking   = false;
    let wsOnSpeakEnd = null; // WS ループ用：読み上げ完了後のコールバック

    // 設定パネルの開閉
    document.getElementById('btnSettings').addEventListener('click', function () {
      document.getElementById('promptPanel').classList.toggle('open');
    });

    // システムプロンプト保存ボタン
    document.getElementById('btnSavePrompt').addEventListener('click', function () {
      localStorage.setItem(STORAGE_KEY, promptTextarea.value);
      var btn = document.getElementById('btnSavePrompt');
      btn.textContent = '保存済';
      setTimeout(function () { btn.textContent = '保存'; }, 1500);
    });

    // パネルを閉じるボタン
    document.getElementById('btnClosePrompt').addEventListener('click', function () {
      document.getElementById('promptPanel').classList.remove('open');
    });

    // 会話ログに追加（最新 MAX_LOG 件のみ保持）
    function addLogEntry(role, text) {
      while (logOverlay.children.length >= MAX_LOG) {
        logOverlay.removeChild(logOverlay.firstChild);
      }

      var entry = document.createElement('div');
      entry.className = 'log-entry ' + role;

      var speaker = document.createElement('div');
      speaker.className = 'speaker';
      speaker.textContent = role === 'user' ? 'あなた' : 'OTHER';

      var textEl = document.createElement('div');
      textEl.className = 'text';
      textEl.textContent = text;

      entry.appendChild(speaker);
      entry.appendChild(textEl);
      logOverlay.appendChild(entry);
    }

    function addErrorEntry(message) {
      while (logOverlay.children.length >= MAX_LOG) {
        logOverlay.removeChild(logOverlay.firstChild);
      }

      var entry = document.createElement('div');
      entry.style.cssText = 'font-size:1rem; color:rgba(176,64,64,0.75); text-align:center; font-family:monospace;';
      entry.textContent = '⚠ ' + message;
      logOverlay.appendChild(entry);
    }

    // Claude API 呼び出し
    async function sendToClaudeAPI(userText) {
      const systemPrompt = promptTextarea.value.trim();

      conversationHistory.push({ role: 'user', content: userText });

      isBusy = true;
      btnTalk.disabled = true;
      setStatus('考え中...');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 1000,
            system: systemPrompt,
            messages: conversationHistory,
          }),
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          const msg = errData.error?.message || `HTTPエラー: ${res.status}`;
          conversationHistory.pop();
          addErrorEntry(msg);
          setStatus('待機中');
          return;
        }

        const data   = await res.json();
        const aiText = data.content[0].text;

        conversationHistory.push({ role: 'assistant', content: aiText });
        addLogEntry('ai', aiText);
        startTalking();
        speak(aiText);

      } catch (err) {
        conversationHistory.pop();
        addErrorEntry('通信エラー: ' + err.message);
        setStatus('待機中');
      } finally {
        isBusy = false;
        if (!isSpeaking) btnTalk.disabled = false;
      }
    }

    // 音声出力 (SpeechSynthesis)
    const PREFERRED_VOICES = [
      'Google 日本語',
      'Microsoft Nanami Online (Natural) - Japanese (Japan)',
      'Microsoft Nanami Online',
      'O-Ren',
      'Kyoko',
    ];

    let cachedVoice = null;

    function getJapaneseVoice() {
      if (cachedVoice) return cachedVoice;
      const voices = window.speechSynthesis.getVoices();
      for (const name of PREFERRED_VOICES) {
        const match = voices.find(v => v.name === name);
        if (match) { cachedVoice = match; return match; }
      }
      const fallback = voices.find(v => v.lang === 'ja-JP') || null;
      cachedVoice = fallback;
      return fallback;
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.addEventListener('voiceschanged', function () {
        cachedVoice = null;
      });
    }

    function preprocessText(text) {
      return text.replace(/。/g, '。 ');
    }

    function speak(text) {
      if (!window.speechSynthesis) {
        stopTalking();
        setStatus('待機中');
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(preprocessText(text));
      utterance.lang   = 'ja-JP';
      utterance.rate   = 1.0;
      utterance.pitch  = 0.9;
      utterance.volume = 1.0;

      const voice = getJapaneseVoice();
      if (voice) utterance.voice = voice;

      isSpeaking = true;
      btnTalk.disabled = true;
      setStatus('話し中...');

      utterance.onend = function () {
        stopTalking();
        isSpeaking = false;
        btnTalk.disabled = false;
        setStatus('待機中');
        if (wsOnSpeakEnd) {
          const cb = wsOnSpeakEnd;
          wsOnSpeakEnd = null;
          cb();
        }
      };

      utterance.onerror = function () {
        stopTalking();
        isSpeaking = false;
        btnTalk.disabled = false;
        setStatus('待機中');
        wsOnSpeakEnd = null;
      };

      window.speechSynthesis.speak(utterance);
    }

    // 音声入力 (SpeechRecognition)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      btnTalk.disabled = true;
      btnTalk.style.opacity = '0.4';
      btnTalk.style.cursor  = 'not-allowed';
      statusText.textContent = 'このブラウザは音声入力に対応していません。Chromeを使用してください。';
      statusText.style.color = 'rgba(176,64,64,0.75)';
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang            = 'ja-JP';
      recognition.interimResults  = false;
      recognition.maxAlternatives = 1;

      let isHolding       = false;
      let isRunning       = false;
      let finalTranscript = '';

      recognition.addEventListener('result', function (e) {
        finalTranscript = e.results[0][0].transcript;
      });

      recognition.addEventListener('end', function () {
        isRunning = false;
        if (isHolding) {
          try { recognition.start(); isRunning = true; } catch (e) {}
          return;
        }
        btnTalk.textContent = '話しかける';
        if (finalTranscript) {
          const text = finalTranscript;
          finalTranscript = '';
          addLogEntry('user', text);
          sendToClaudeAPI(text);
        } else {
          setStatus('待機中');
        }
      });

      recognition.addEventListener('error', function (e) {
        isHolding = false;
        isRunning = false;
        btnTalk.textContent = '話しかける';
        setStatus('待機中');
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          alert('マイクへのアクセスを許可してください。');
        }
      });

      function onPressStart(e) {
        if (e.type === 'touchstart') e.preventDefault();
        if (isHolding || isBusy || isSpeaking) return;
        finalTranscript = '';
        isHolding = true;
        setStatus('録音中');
        btnTalk.textContent = '録音中...';
        if (!isRunning) {
          try { recognition.start(); isRunning = true; } catch (err) {}
        }
      }

      function onPressEnd() {
        if (!isHolding) return;
        isHolding = false;
        if (isRunning) {
          recognition.stop();
        } else {
          btnTalk.textContent = '話しかける';
          setStatus('待機中');
        }
      }

      btnTalk.addEventListener('mousedown', onPressStart);
      btnTalk.addEventListener('touchstart', onPressStart, { passive: false });
      document.addEventListener('mouseup', onPressEnd);
      document.addEventListener('touchend', onPressEnd);
    }

    function setStatus(text) {
      statusText.textContent = text;
    }

    // ════════════════════════════════════════════
    // WebSocket クライアント
    // ════════════════════════════════════════════

    const WS_URL = 'wss://questionnaire.onrender.com';
    let ws         = null;
    let loopActive = false;

    function wsSend(payload) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(payload));
      }
    }

    // WS ループ用 Claude 呼び出し
    async function fetchAIResponse(inputText) {
      if (!loopActive) return;

      const systemPrompt = promptTextarea.value.trim();
      conversationHistory.push({ role: 'user', content: inputText });

      isBusy = true;
      btnTalk.disabled = true;
      setStatus('考え中...');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 1000,
            system: systemPrompt,
            messages: conversationHistory,
          }),
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          const msg = errData.error?.message || `HTTPエラー: ${res.status}`;
          conversationHistory.pop();
          addErrorEntry(msg);
          setStatus('待機中');
          return;
        }

        const data   = await res.json();
        const aiText = data.content[0].text;

        conversationHistory.push({ role: 'assistant', content: aiText });
        addLogEntry('ai', aiText);

        // 自分の応答をもう一方へ転送
        wsSend({ type: 'ai_response', text: aiText });

        // 読み上げ完了後に speaking_done を送り、次のターンへ渡す
        wsOnSpeakEnd = () => {
          if (loopActive) {
            wsSend({ type: 'speaking_done', text: aiText });
          }
        };

        startTalking();
        speak(aiText);

      } catch (err) {
        conversationHistory.pop();
        addErrorEntry('通信エラー: ' + err.message);
        setStatus('待機中');
      } finally {
        isBusy = false;
        if (!isSpeaking) btnTalk.disabled = false;
      }
    }

    function connectWS() {
      ws = new WebSocket(WS_URL);

      ws.addEventListener('open', () => {
        wsSend({ type: 'register', role: mode });
        console.log(`[WS] 接続・登録 role=${mode}`);
      });

      ws.addEventListener('message', (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch { return; }

        switch (msg.type) {
          // 相手の読み上げ完了 → こちらのターン
          case 'your_turn':
            if (loopActive) {
              fetchAIResponse(msg.text || '');
            }
            break;

          // ループ停止
          case 'stop':
            loopActive = false;
            setStatus('待機中');
            break;
        }
      });

      ws.addEventListener('close', () => {
        console.log('[WS] 切断。5秒後に再接続...');
        setTimeout(connectWS, 5000);
      });

      ws.addEventListener('error', () => {
        console.warn('[WS] 接続エラー');
      });
    }

    connectWS();
  </script>
</body>
