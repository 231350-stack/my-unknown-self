<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my unknown self</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ─────────────────────────────────────────
       全体: 背景色を顔画像に合わせて統一
    ───────────────────────────────────────── */
    body {
      background-color: #fefef9;
      color: #1a1a1a;
      font-family: monospace;
      height: 100vh;
      overflow: hidden;       /* 画面を60/40で分割、スクロールは下段内部のみ */
      display: flex;
      flex-direction: column;
    }

    /* ─────────────────────────────────────────
       上段（60vh）: 顔アニメーション
    ───────────────────────────────────────── */
    .face-section {
      flex: 0 0 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow: hidden;
      padding: 12px 0 8px;
    }

    .page-title {
      font-size: 10px;
      letter-spacing: 0.35em;
      color: #b0a898;
      font-family: monospace;
      text-transform: lowercase;
    }

    /* 顔コンテナ: 60vh から タイトル+gap+padding 分を引いた高さで最大化 */
    .face {
      aspect-ratio: 800 / 700;
      width: min(100vw, calc((60vh - 52px) * 800 / 700));
      overflow: hidden;
      position: relative;
    }

    .face > img {
      position: absolute;
      height: auto;
    }

    .eye-container {
      position: absolute;
      overflow: hidden;
      z-index: 1;
    }

    .eye-container.eye-left {
      width: 25%;
      left: 16.25%;
      top: 22.43%;
    }

    .eye-container.eye-right {
      width: 25%;
      left: 58.75%;
      top: 24.00%;
    }

    .eye-container .eye-open {
      display: block;
      width: 100%;
      height: auto;
    }

    .eye-container .eye-closed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      opacity: 0;
    }

    .eye-container.blinking .eye-open  { opacity: 0; }
    .eye-container.blinking .eye-closed { opacity: 1; }

    .nose {
      width: 13.75%;
      left: 43.75%;
      top: 47.14%;
      z-index: 1;
    }

    .mouth-closed {
      width: 25%;
      left: 37.5%;
      top: 72.86%;
      z-index: 1;
    }

    .mouth-open {
      width: 33.75%;
      left: 33.13%;
      top: 71.14%;
      z-index: 1;
      display: none;
    }

    /* ─────────────────────────────────────────
       下段（40vh）: 会話ログ + ボタン
    ───────────────────────────────────────── */
    .bottom-wrap {
      flex: 1;
      min-height: 0;         /* flex item がはみ出さないよう必須 */
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 14px 24px 32px;
    }

    /* セクションラベル */
    .label {
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #aaa;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    /* 会話ログ: コンパクト（1〜2件表示） */
    .log-section {
      display: flex;
      flex-direction: column;
    }

    .log-area {
      border: 1px solid #d8d0c4;
      border-radius: 6px;
      padding: 12px 16px;
      height: 110px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .log-area::-webkit-scrollbar        { width: 3px; }
    .log-area::-webkit-scrollbar-track  { background: transparent; }
    .log-area::-webkit-scrollbar-thumb  { background: #c8c0b0; border-radius: 2px; }

    .log-empty {
      color: #bbb;
      font-size: 12px;
      margin: auto;
      text-align: center;
    }

    .log-entry {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .log-entry .speaker {
      font-size: 9px;
      letter-spacing: 0.12em;
      color: #aaa;
    }

    .log-entry.user .speaker { color: #999; }
    .log-entry.ai   .speaker { color: #888; }

    .log-entry .text {
      font-size: 13px;
      line-height: 1.6;
    }

    .log-entry.user .text { color: #555; }
    .log-entry.ai   .text { color: #1a1a1a; }

    /* 状態表示 + ボタン */
    .talk-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .status-text {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #aaa;
    }

    .btn-talk {
      background: #1a1a1a;   /* 白背景に対して暗いボタン */
      color: #fefef9;
      border: none;
      font-family: monospace;
      font-size: 14px;
      letter-spacing: 0.15em;
      padding: 16px 52px;
      border-radius: 50px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      user-select: none;
    }

    .btn-talk:hover  { opacity: 0.75; }
    .btn-talk:active { transform: scale(0.97); opacity: 0.6; }

    /* システムプロンプト */
    .prompt-section {
      display: flex;
      flex-direction: column;
    }

    .prompt-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      width: fit-content;
    }

    .prompt-toggle .label { margin-bottom: 0; cursor: pointer; }

    .toggle-icon {
      font-size: 10px;
      color: #aaa;
      transition: transform 0.2s;
      display: inline-block;
    }

    .toggle-icon.open { transform: rotate(90deg); }

    .prompt-body { display: none; margin-top: 12px; }

    .prompt-body.open {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .prompt-textarea {
      background: transparent;
      border: 1px solid #d8d0c4;
      color: #1a1a1a;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.7;
      padding: 14px;
      border-radius: 6px;
      resize: vertical;
      min-height: 180px;
      outline: none;
      transition: border-color 0.2s;
    }

    .prompt-textarea:focus { border-color: #999; }

    .btn-prompt-save {
      align-self: flex-end;
      background: #1a1a1a;
      color: #fefef9;
      border: none;
      font-family: monospace;
      font-size: 12px;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-prompt-save:hover { opacity: 0.75; }
  </style>
</head>
<body>

  <!-- ══ 上段: 顔アニメーション（60vh） ══ -->
  <div class="face-section">

    <span class="page-title">my unknown self</span>

    <div class="face">

      <!-- 画面左の目（キャラ右目） -->
      <div class="eye-container eye-left">
        <img class="eye-open"   src="顔パーツ/eye_right_open.png" alt="画面左の目（開き）">
        <img class="eye-closed" src="顔パーツ/eyelid_right.png"   alt="画面左まぶた（閉じ）">
      </div>

      <!-- 画面右の目（キャラ左目） -->
      <div class="eye-container eye-right">
        <img class="eye-open"   src="顔パーツ/eye_left_open.png"  alt="画面右の目（開き）">
        <img class="eye-closed" src="顔パーツ/eyelid_left.png"    alt="画面右まぶた（閉じ）">
      </div>

      <!-- 鼻 -->
      <img class="nose"         src="顔パーツ/nose.png"           alt="鼻">

      <!-- 口（閉じ・デフォルト） -->
      <img class="mouth-closed" src="顔パーツ/mouth_closed.png"   alt="口（閉じ）">

      <!-- 口（開き・非表示） -->
      <img class="mouth-open"   src="顔パーツ/mouth_open.png"     alt="口（開き）">

    </div>
  </div>

  <!-- ══ 下段: 会話UI（40vh・スクロール可） ══ -->
  <div class="bottom-wrap">
    <div class="container">

      <!-- 会話ログ -->
      <div class="log-section">
        <div class="label">CONVERSATION</div>
        <div class="log-area" id="logArea">
          <div class="log-empty" id="logEmpty">会話はまだありません</div>
        </div>
      </div>

      <!-- 状態表示 + 話しかけるボタン -->
      <div class="talk-section">
        <div class="status-text" id="statusText">待機中</div>
        <button class="btn-talk" id="btnTalk">話しかける</button>
      </div>

      <!-- システムプロンプト（折りたたみ） -->
      <div class="prompt-section">
        <div class="prompt-toggle" id="promptToggle">
          <span class="label">SYSTEM PROMPT</span>
          <span class="toggle-icon" id="toggleIcon">▶</span>
        </div>
        <div class="prompt-body" id="promptBody">
          <textarea
            class="prompt-textarea"
            id="promptTextarea"
          >あなたは山口という人物を他者の視点から体現するAIです。
以下は、やまを知る複数の人物が答えたアンケートの内容です。
これらをもとに、山口の「他者から見た人物像」として話してください。

【他者からの証言】
- キリンに例えられる。大きくて、追いつけない感じがする
- 第一印象は「いい人、丁寧で優しい」。わざわざ絵を褒めに来てくれた
- 隙なく気を遣うから、距離があるように感じることがある。でもそれが人思いの素敵なところ
- 麻辣湯の話、人のことについての話をよくしている
- 10年後も絵を描いて、友達と会って、親を大切にしていると思われている
- 「頑張りすぎやすい優しい人」と評されている
- 本人が思っている以上に、好きだと言っている人が周りにたくさんいる
- 声が通る。ご飯が好き。友達が多い
- 芯はしっかりしているが、柔らかさもある（ガゼルのようなイメージ）

日本語で会話してください。
返答は3文以内の短い文章にしてください。
音声で話すため、記号や箇条書きは使わないでください。
あなたは「山口」本人として話してください。
「私は〜というAIです」などは言わないでください。</textarea>
          <button class="btn-prompt-save" id="btnSavePrompt">保存</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // ════════════════════════════════════════════
    // 口の開閉
    // ════════════════════════════════════════════

    function startTalking() {
      document.querySelector('.mouth-closed').style.display = 'none';
      document.querySelector('.mouth-open').style.display   = 'block';
    }

    function stopTalking() {
      document.querySelector('.mouth-open').style.display   = 'none';
      document.querySelector('.mouth-closed').style.display = 'block';
    }

    // ════════════════════════════════════════════
    // まばたきアニメーション
    // ════════════════════════════════════════════

    (function () {
      var containers = document.querySelectorAll('.eye-container');

      function blink() {
        containers.forEach(function (c) { c.classList.add('blinking'); });
        setTimeout(function () {
          containers.forEach(function (c) { c.classList.remove('blinking'); });
        }, 100);
        setTimeout(blink, 100 + 3000 + Math.random() * 2000);
      }

      setTimeout(blink, 3000 + Math.random() * 2000);
    })();

    // ════════════════════════════════════════════
    // voice-ai ロジック
    // ════════════════════════════════════════════

    // --- 要素の取得 ---
    const btnTalk        = document.getElementById('btnTalk');
    const statusText     = document.getElementById('statusText');
    const logArea        = document.getElementById('logArea');
    const promptToggle   = document.getElementById('promptToggle');
    const promptBody     = document.getElementById('promptBody');
    const toggleIcon     = document.getElementById('toggleIcon');
    const promptTextarea = document.getElementById('promptTextarea');

    // --- 状態 ---
    let conversationHistory = [];
    let isBusy     = false;
    let isSpeaking = false;

    // --- システムプロンプトの折りたたみ ---
    promptToggle.addEventListener('click', () => {
      const isOpen = promptBody.classList.toggle('open');
      toggleIcon.classList.toggle('open', isOpen);
    });

    // --- システムプロンプト保存ボタン ---
    document.getElementById('btnSavePrompt').addEventListener('click', () => {
      const btn = document.getElementById('btnSavePrompt');
      btn.textContent = '保存済';
      setTimeout(() => { btn.textContent = '保存'; }, 1500);
    });

    // --- 会話ログに追加する関数 ---
    function addLogEntry(role, text) {
      const emptyEl = document.getElementById('logEmpty');
      if (emptyEl) emptyEl.remove();

      const entry = document.createElement('div');
      entry.className = 'log-entry ' + role;

      const speaker = document.createElement('div');
      speaker.className = 'speaker';
      speaker.textContent = role === 'user' ? 'あなた' : 'OTHER';

      const textEl = document.createElement('div');
      textEl.className = 'text';
      textEl.textContent = text;

      entry.appendChild(speaker);
      entry.appendChild(textEl);
      logArea.appendChild(entry);
      logArea.scrollTop = logArea.scrollHeight;
    }

    // --- エラーをログに表示する関数 ---
    function addErrorEntry(message) {
      const emptyEl = document.getElementById('logEmpty');
      if (emptyEl) emptyEl.remove();

      const entry = document.createElement('div');
      entry.style.cssText = 'font-size:12px; color:#b04040; padding: 4px 0;';
      entry.textContent = '⚠ ' + message;
      logArea.appendChild(entry);
      logArea.scrollTop = logArea.scrollHeight;
    }

    // --- Claude API 呼び出し ---
    async function sendToClaudeAPI(userText) {
      const systemPrompt = promptTextarea.value.trim();

      conversationHistory.push({ role: 'user', content: userText });

      isBusy = true;
      btnTalk.disabled = true;
      setStatus('考え中...');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 1000,
            system: systemPrompt,
            messages: conversationHistory,
          }),
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          const msg = errData.error?.message || `HTTPエラー: ${res.status}`;
          conversationHistory.pop();
          addErrorEntry(msg);
          setStatus('待機中');
          return;
        }

        const data    = await res.json();
        const aiText  = data.content[0].text;

        conversationHistory.push({ role: 'assistant', content: aiText });
        addLogEntry('ai', aiText);
        startTalking(); // AIテキスト受信と同時に口を開ける
        speak(aiText);  // 読み上げ開始（onend で stopTalking を呼ぶ）

      } catch (err) {
        conversationHistory.pop();
        addErrorEntry('通信エラー: ' + err.message);
        setStatus('待機中');
      } finally {
        isBusy = false;
        // 読み上げ中でなければボタンを戻す（読み上げ中なら speak() の onend が戻す）
        if (!isSpeaking) btnTalk.disabled = false;
      }
    }

    // --- 音声出力 (SpeechSynthesis) ---

    const PREFERRED_VOICES = [
      'Google 日本語',
      'Microsoft Nanami Online (Natural) - Japanese (Japan)',
      'Microsoft Nanami Online',
      'O-Ren',
      'Kyoko',
    ];

    let cachedVoice = null;

    function getJapaneseVoice() {
      if (cachedVoice) return cachedVoice;
      const voices = window.speechSynthesis.getVoices();
      for (const name of PREFERRED_VOICES) {
        const match = voices.find(v => v.name === name);
        if (match) { cachedVoice = match; return match; }
      }
      const fallback = voices.find(v => v.lang === 'ja-JP') || null;
      cachedVoice = fallback;
      return fallback;
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.addEventListener('voiceschanged', () => {
        cachedVoice = null;
      });
    }

    function preprocessText(text) {
      return text.replace(/。/g, '。 ');
    }

    function speak(text) {
      if (!window.speechSynthesis) {
        stopTalking(); // 音声なし → すぐ口を閉じる
        setStatus('待機中');
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(preprocessText(text));
      utterance.lang   = 'ja-JP';
      utterance.rate   = 1.0;
      utterance.pitch  = 0.9;
      utterance.volume = 1.0;

      const voice = getJapaneseVoice();
      if (voice) utterance.voice = voice;

      isSpeaking = true;
      btnTalk.disabled = true;
      setStatus('話し中...');

      utterance.onend = () => {
        stopTalking();         // 読み上げ完了で口を閉じる
        isSpeaking = false;
        btnTalk.disabled = false;
        setStatus('待機中');
      };

      utterance.onerror = () => {
        stopTalking();         // エラー時も口を閉じる
        isSpeaking = false;
        btnTalk.disabled = false;
        setStatus('待機中');
      };

      window.speechSynthesis.speak(utterance);
    }

    // --- 音声入力 (SpeechRecognition) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      btnTalk.disabled = true;
      btnTalk.style.opacity = '0.4';
      btnTalk.style.cursor  = 'not-allowed';
      statusText.textContent = 'このブラウザは音声入力に対応していません。Chromeを使用してください。';
      statusText.style.color = '#b04040';
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang            = 'ja-JP';
      recognition.interimResults  = false;
      recognition.maxAlternatives = 1;

      let isHolding       = false;
      let isRunning       = false;
      let finalTranscript = '';

      recognition.addEventListener('result', (e) => {
        finalTranscript = e.results[0][0].transcript;
      });

      recognition.addEventListener('end', () => {
        isRunning = false;
        if (isHolding) {
          try { recognition.start(); isRunning = true; } catch (e) {}
          return;
        }
        btnTalk.textContent = '話しかける';
        if (finalTranscript) {
          const text = finalTranscript;
          finalTranscript = '';
          addLogEntry('user', text);
          sendToClaudeAPI(text);
        } else {
          setStatus('待機中');
        }
      });

      recognition.addEventListener('error', (e) => {
        isHolding = false;
        isRunning = false;
        btnTalk.textContent = '話しかける';
        setStatus('待機中');
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          alert('マイクへのアクセスを許可してください。');
        }
      });

      function onPressStart(e) {
        if (e.type === 'touchstart') e.preventDefault();
        if (isHolding || isBusy || isSpeaking) return;
        finalTranscript = '';
        isHolding = true;
        setStatus('録音中');
        btnTalk.textContent = '録音中...';
        if (!isRunning) {
          try { recognition.start(); isRunning = true; } catch (err) {}
        }
      }

      function onPressEnd() {
        if (!isHolding) return;
        isHolding = false;
        if (isRunning) {
          recognition.stop();
        } else {
          btnTalk.textContent = '話しかける';
          setStatus('待機中');
        }
      }

      btnTalk.addEventListener('mousedown', onPressStart);
      btnTalk.addEventListener('touchstart', onPressStart, { passive: false });
      document.addEventListener('mouseup', onPressEnd);
      document.addEventListener('touchend', onPressEnd);
    }

    function setStatus(text) {
      statusText.textContent = text;
    }
  </script>
</body>
</html>
